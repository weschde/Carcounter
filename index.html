const hs=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%9973};
function rnd(a){const x=Math.sin(a*12.9898)*43758.5453;return x-Math.floor(x)}
function tally(n,seed){
  if(!n)return'';seed=seed||0;let h='',c=0;const g=Math.floor(n/5),r=n%5;
  const ln=(x1,y1,x2,y2)=>{const k=seed*7+(c++)*3.1;const j=v=>rnd(k+v)-.5;return'<path style="stroke-width:'+(1.9+rnd(k+9)*.9).toFixed(2)+'" d="M'+(x1+j(1)*1.2).toFixed(1)+' '+(y1+j(2)*1.6).toFixed(1)+'L'+(x2+j(3)*1.4).toFixed(1)+' '+(y2+j(4)*1.6).toFixed(1)+'"/>'};
  for(let i=0;i<g;i++){let p='';for(let j=0;j<4;j++)p+=ln(4+6*j,2,4+6*j+(rnd(seed+i*5+j)-.5)*1.2,20);p+=ln(1,17,25,5);h+='<svg class="tg" viewBox="0 0 26 22" width="26" height="22" aria-hidden="true">'+p+'</svg>'}
  if(r){let p='';for(let j=0;j<r;j++)p+=ln(3+6*j,2,3+6*j,20);h+='<svg class="tg" viewBox="0 0 '+(r*6+1)+' 22" width="'+(r*6+1)+'" height="22" aria-hidden="true">'+p+'</svg>'}
  return h;
}

/* Statistik */
function statsFor(trips){
  const B={},V={},Sp={};let tot=0,secs=0,secTot=0,seenTrips=0;
  trips.forEach(t=>{
    for(const k in t.counts){const n=t.counts[k];if(!n)continue;
      if(k[0]==='#'){Sp[k.slice(1)]=(Sp[k.slice(1)]||0)+n;continue}
      const [b,v]=k.split('|');B[b]=(B[b]||0)+n;tot+=n;if(v)V[b+' '+v]=(V[b+' '+v]||0)+n}
    (t.notes||[]).forEach(n=>{const l=n.lane==='Gegenspur'?'Besondere Gegenspur (frei)':n.lane==='Mitspur'?'Besondere Mitspur (frei)':n.lane;Sp[l]=(Sp[l]||0)+1});
    if(t.t0&&t.t1&&t.t1-t.t0>=600000){secs+=(t.t1-t.t0)/1000;secTot+=total(t)}
  });
  return{B,V,Sp,tot,perHour:secs?secTot/(secs/3600):null};
}
function barsHTML(entries,max){
  if(!entries.length)return'<p class="muted">Noch keine Daten.</p>';
  const m=max||Math.max(...entries.map(e=>e[1]));
  return'<div class="bars">'+entries.map(([l,v])=>'<div class="brow"><span class="l" title="'+esc(l)+'">'+esc(l)+'</span><span class="b"><i style="width:'+Math.max(3,Math.round(v/m*100))+'%"></i></span><span class="v">'+v+'</span></div>').join('')+'</div>';
}
const nf=n=>n.toLocaleString('de-DE',{maximumFractionDigits:1});
function renderStats(){
  const m=$('#main');
  const sel=ui.scope==='all'?S.trips:S.trips.filter(t=>t.id===ui.scope);
  const scopeOk=ui.scope==='all'||S.trips.some(t=>t.id===ui.scope);
  if(!scopeOk)ui.scope='all';
  const st=statsFor(sel);
  const opts='<option value="all">Alle Fahrten</option>'+S.trips.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>'<option value="'+t.id+'"'+(ui.scope===t.id?' selected':'')+'>'+fmtDate(t.date)+' – '+esc((t.dest||'Fahrt').slice(0,40))+'</option>').join('');
  let h='<div class="pad"><h2>Statistik</h2><select id="scope" aria-label="Auswahl">'+opts+'</select>';
  if(!st.tot){h+='<p class="muted">Noch keine Striche. Starte im Tab „Zählen“ eine Fahrt.</p></div>';m.innerHTML=h;return}
  const seen=Object.keys(st.B).length,nb=allBrands().length;
  h+='<div class="btns"><button class="btn primary" data-act="pdfStats">Als PDF speichern</button><button class="btn" data-act="print">Drucken</button></div><p class="muted" id="pmsg"></p>';
  h+='<div class="kpis" style="margin-top:12px"><div class="kpi"><b>'+sel.length+'</b><span>Fahrten</span></div><div class="kpi"><b>'+st.tot+'</b><span>Striche gesamt</span></div><div class="kpi"><b>'+nf(st.tot/sel.length)+'</b><span>Ø Striche pro Fahrt</span></div><div class="kpi"><b>'+seen+' / '+nb+'</b><span>Marken gesehen</span></div>'
    +(st.perHour?'<div class="kpi" style="grid-column:1/-1"><b>'+nf(st.perHour)+'</b><span>Striche pro Stunde (Fahrten mit Start und Ende)</span></div>':'')+'</div>';
  const top=Object.entries(st.B).sort((a,b)=>b[1]-a[1]).slice(0,10);
  h+='<h2>Häufigste Marken</h2>'+barsHTML(top);
  const vw=VWGROUP.reduce((a,b)=>a+(st.B[b]||0),0);
  h+='<p>VW-Konzern (VW, Audi, Skoda, Seat, Cupra, Porsche, Lamborghini, Bentley): <b>'+nf(vw/st.tot*100)+' %</b> aller Striche.</p>';
  const or={};allBrands().forEach(([n,,o])=>{if(st.B[n])or[o]=(or[o]||0)+st.B[n]});
  h+='<h2>Herkunft</h2>'+barsHTML(Object.entries(or).sort((a,b)=>b[1]-a[1]).map(([o,v])=>[ORIGIN[o],v]));
  const vs=Object.entries(st.V).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(vs.length)h+='<h2>Sportmodelle und Tuner</h2>'+barsHTML(vs);
  const sp=Object.entries(st.Sp).sort((a,b)=>b[1]-a[1]);
  if(sp.length)h+='<h2>Besondere Fahrzeuge</h2>'+barsHTML(sp);
  if(ui.scope==='all'&&S.trips.length>1){
    const tr=S.trips.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[fmtDate(t.date),total(t)]);
    h+='<h2>Verlauf pro Fahrt</h2>'+barsHTML(tr);
  }
  const unseen=allBrands().map(x=>x[0]).filter(n=>!st.B[n]);
  h+='<details><summary>Noch nie gesehen ('+unseen.length+')</summary><p>'+unseen.map(esc).join(', ')+'</p></details></div>';
  m.innerHTML=h;
}

/* ---------- Aktionen ---------- */
function endActive(){const t=active();if(t){t.done=true;t.t1=Date.now()}S.activeId=null}
function act(a,d,el){
  switch(a){
    case'tab':ui.tab=d.tab;renderMain();renderNav();window.scrollTo(0,0);break;
    case'sub':ui.sub=d.sub;renderCount();window.scrollTo(0,0);break;
    case'inc':inc(d.key);break;
    case'dec':dec(d.key);break;
    case'undo':undo();break;
    case'sort':ui.sort=ui.sort==='count'?'sheet':'count';el.classList.toggle('on',ui.sort==='count');updateList();break;
    case'onlySeen':ui.onlySeen=!ui.onlySeen;el.classList.toggle('on',ui.onlySeen);updateList();break;
    case'startTrip':{const dest=($('#dest').value||'').trim(),date=$('#date').value||today();endActive();
      const t={id:uid(),date,dest:dest||'Fahrt',t0:Date.now(),t1:null,done:false,counts:{},notes:[],log:[]};S.trips.push(t);S.activeId=t.id;save();ui.tab='count';render();break}
    case'newTrip':endActive();save();ui.tab='count';render();break;
    case'endTrip':{const id=S.activeId;endActive();save();closeSheet();render();if(id)openSheet({kind:'trip',id});break}
    case'addNote':{const t=active();const v=($('#note').value||'').trim();if(t&&v){t.notes.push({lane:$('#lane').value,text:v});$('#note').value='';save();updateNotes()}break}
    case'addLaneNote':{const t=active();const inp=$('#'+d.inp);const v=inp?(inp.value||'').trim():'';if(t&&v){t.notes.push({lane:d.lane,text:v});inp.value='';save();updateNotes()}break}
    case'delNote':{const t=active();if(t){t.notes.splice(+d.i,1);save();updateNotes()}break}
    case'addCustom':{const v=($('#cb').value||'').trim();if(v&&!allBrands().some(x=>x[0].toLowerCase()===v.toLowerCase())){S.custom.push(v);save();$('#cb').value='';updateList()}break}
    case'saveBrand':{const t=active();if(t){for(let i=0;i<+d.n;i++){const inp=$('#f'+i);const n=Math.max(0,Math.floor(+inp.value)||0);const k=inp.dataset.k;if(n)t.counts[k]=n;else delete t.counts[k]}save();closeSheet();renderBar();updateList();updateSpec()}break}
    case'closeSheet':closeSheet();break;
    case'openTrip':openSheet({kind:'trip',id:d.id});break;
    case'saveDest':{const t=S.trips.find(x=>x.id===d.id);if(t){t.dest=($('#tdest').value||'').trim()||'Fahrt';save();renderSheet();renderBar();renderMain()}break}
    case'markChecked':{const t=S.trips.find(x=>x.id===d.id);if(t){delete t.estimated;save();renderSheet()}break}
    case'resume':{const t=S.trips.find(x=>x.id===d.id);if(t){endActive();t.done=false;t.t1=null;if(!t.t0)t.t0=null;S.activeId=t.id;save();closeSheet();ui.tab='count';render()}break}
    case'delTrip':{if(ui.confirm===d.id){S.trips=S.trips.filter(x=>x.id!==d.id);if(S.activeId===d.id)S.activeId=null;ui.confirm=null;save();closeSheet();render()}else{ui.confirm=d.id;renderSheet()}break}
    case'cmpPreset':ui.cmpA=d.a;ui.cmpB=d.b;renderCompare();break;
    case'pdfCmp':{const A=resolveGroup(ui.cmpA),B=resolveGroup(ui.cmpB);pdfCompare(A,B);break}
    case'vtest':{let txt;if(!('vibrate' in navigator)){txt='Dieser Browser unterstützt keine Vibration.'}else{let ok=false;try{ok=navigator.vibrate([250,120,250])}catch(e){}txt=ok?'Der Browser hat die Vibration ausgelöst. Spürst du nichts, blockiert dein Handy sie: Prüfe Lautlos-Modus, Nicht stören, Energiesparmodus und in den Systemeinstellungen Vibration bzw. Touch-Feedback.':'Der Browser hat die Vibration abgelehnt.'}const el=$('#vmsg');if(el)el.textContent=txt;break}
    case'settings':openSheet({kind:'settings'});break;
    case'card':makeCard(d.id);break;
    case'cardShare':cardShare();break;
    case'toggle':{S.set=S.set||{};S.set[d.k]=!cfg(d.k);save();if(d.k==='sound'&&cfg('sound'))beep(false);if(d.k==='vibe'&&cfg('vibe')){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}if(ui.sheet&&ui.sheet.kind==='settings')renderSheet();else if(ui.tab==='trips')renderTrips();if(d.k==='grey'&&ui.tab==='count')updateList();break}
    case'print':{try{window.print()}catch(e){setMsg('Drucken ist hier nicht verfügbar. Speichere stattdessen als PDF.')}break}
    case'pdfTrip':{const t=S.trips.find(x=>x.id===d.id);if(t)pdfSave([t],t.dest||'Fahrt',fmtDate(t.date)+' - '+total(t)+' Striche','CarCounter_'+t.date+'.pdf');break}
    case'pdfStats':{const sel=ui.scope==='all'?S.trips:S.trips.filter(t=>t.id===ui.scope);if(!sel.length)break;
      if(sel.length===1)pdfSave(sel,sel[0].dest||'Fahrt',fmtDate(sel[0].date)+' - '+total(sel[0])+' Striche','CarCounter_'+sel[0].date+'.pdf');
      else pdfSave(sel,'Car Counter: Gesamtstatistik',sel.length+' Fahrten, Stand '+fmtDate(today()),'CarCounter_Gesamtstatistik_'+today()+'.pdf');break}
    case'export':openSheet({kind:'export'});break;
    case'importOpen':openSheet({kind:'import'});break;
    case'copyExp':{const ta=$('#exp');ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e){}let ok=false;try{ok=document.execCommand('copy')}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(ta.value).then(()=>{ui.msg='Kopiert.';renderSheet()});ok=true}catch(e){}ui.msg=ok?'Kopiert.':'Text markiert – bitte manuell kopieren.';renderSheet();break}
    case'doImport':{try{const o=JSON.parse($('#imp').value);if(!o||!Array.isArray(o.trips))throw 0;let n=0;o.trips.forEach(t=>{if(t&&t.id&&t.counts&&!S.trips.some(x=>x.id===t.id)){t.log=t.log||[];t.notes=t.notes||[];S.trips.push(t);n++}});(o.custom||[]).forEach(c=>{if(!S.custom.includes(c))S.custom.push(c)});save();ui.msg=n+' Fahrt(en) eingelesen.';renderSheet();renderMain()}catch(e){ui.msg='Das sieht nicht nach einer gültigen Sicherung aus.';renderSheet()}break}
  }
}

/* ---------- PDF ---------- */
function setMsg(t){document.querySelectorAll('#pmsg').forEach(e=>e.textContent=t)}
async function getDownloads(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
async function deliver(blob,fn){
  const dl=await getDownloads();
  if(dl){await dl.save({filename:fn,data:blob});return 'ok'}
  try{const f=new File([blob],fn,{type:blob.type||'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return 'ok'}}catch(e){if(e&&e.name==='AbortError')return 'abort'}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return 'ok'}catch(e){return 'fail'}
}
function makePdf(trips,title,sub){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('nolib');
  const doc=new J({unit:'mm',format:'a4'});const W=210,M=15;let y=0;
  doc.setFillColor(11,79,158);doc.rect(0,0,W,26,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(15);
  doc.text(doc.splitTextToSize(title,W-2*M)[0],M,12);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(sub,M,20);doc.setTextColor(0);y=36;
  const need=h=>{if(y+h>284){doc.addPage();y=18}};
  const H=t=>{need(16);y+=5;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(11,79,158);doc.text(t,M,y);doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(10);y+=7};
  const P=t=>{doc.setFontSize(10);doc.splitTextToSize(t,W-2*M).forEach(l=>{need(5);doc.text(l,M,y);y+=5})};
  const bars=en=>{if(!en.length){P('Keine Daten.');return}const mx=Math.max(...en.map(e=>e[1]),1);en.forEach(([l,v])=>{need(6);doc.setFontSize(10);doc.setTextColor(0);doc.text(String(l).slice(0,26),M,y);doc.setFillColor(29,47,166);doc.rect(58,y-3.2,Math.max(1,v/mx*105),3.8,'F');doc.text(String(v),168,y);y+=6})};
  const tallyPdf=(x,yy,n)=>{doc.setDrawColor(29,47,166);doc.setLineWidth(.45);const g=Math.floor(n/5),r=n%5;let cx=x;const mxX=W-M;
    for(let i=0;i<g&&cx+6<=mxX;i++){for(let j=0;j<4;j++)doc.line(cx+j*1.4,yy-3.6,cx+j*1.4,yy);doc.line(cx-.8,yy-.8,cx+5,yy-2.8);cx+=6.6}
    for(let j=0;j<r&&cx+1.4<=mxX;j++)doc.line(cx+j*1.4,yy-3.6,cx+j*1.4,yy);doc.setDrawColor(0)};
  const st=statsFor(trips);const many=trips.length>1;
  if(many){
    P('Fahrten: '+trips.length+'     Striche gesamt: '+st.tot+'     Durchschnitt pro Fahrt: '+nf(st.tot/trips.length));
    P('Marken gesehen: '+Object.keys(st.B).length+' von '+allBrands().length+(st.perHour?'     Striche pro Stunde: '+nf(st.perHour):''));
  }else{
    const t=trips[0];P('Datum: '+fmtDate(t.date)+'     Striche gesamt: '+st.tot+'     Marken gesehen: '+Object.keys(st.B).length);
    if(t.estimated)P('Hinweis: Werte aus einem Foto geschätzt.');
  }
  const top=Object.entries(st.B).sort((a,b)=>b[1]-a[1]);
  H('Häufigste Marken');bars(top.slice(0,10));
  if(st.tot){
    const vw=VWGROUP.reduce((a,b)=>a+(st.B[b]||0),0);y+=1;P('VW-Konzern: '+nf(vw/st.tot*100)+' % aller Striche.');
    const or={};allBrands().forEach(([n,,o])=>{if(st.B[n])or[o]=(or[o]||0)+st.B[n]});
    H('Herkunft');bars(Object.entries(or).sort((a,b)=>b[1]-a[1]).map(([o,v])=>[ORIGIN[o],v]));
    const vs=Object.entries(st.V).sort((a,b)=>b[1]-a[1]).slice(0,8);if(vs.length){H('Sportmodelle und Tuner');bars(vs)}
    const sp=Object.entries(st.Sp).sort((a,b)=>b[1]-a[1]);if(sp.length){H('Besondere Fahrzeuge');bars(sp)}
  }
  if(many){H('Verlauf pro Fahrt');bars(trips.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[fmtDate(t.date),total(t)]))}
  const notes=[];trips.forEach(t=>t.notes.forEach(n=>notes.push((many?fmtDate(t.date)+' ':'')+n.lane+': '+n.text)));
  if(notes.length){H('Notizen');notes.forEach(n=>P('- '+n))}
  if(top.length){H('Alle Marken');top.forEach(([n,v])=>{need(6.5);doc.setFontSize(10);doc.setTextColor(0);doc.text(n,M,y);doc.text(String(v),58,y,{align:'right'});tallyPdf(62,y,v);y+=6.5})}
  const unseen=allBrands().map(x=>x[0]).filter(n=>!st.B[n]);
  if(unseen.length){H('Noch nie gesehen ('+unseen.length+')');P(unseen.join(', '))}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text('Car Counter, Seite '+i+' von '+n,W/2,291,{align:'center'})}
  return doc;
}
async function pdfSave(trips,title,sub,fn){
  setMsg('PDF wird erstellt ...');
  try{
    const doc=makePdf(trips,title,sub);const blob=doc.output('blob');const r=await deliver(blob,fn);setMsg(r==='ok'?'PDF gespeichert oder geteilt.':r==='abort'?'Abgebrochen.':'Speichern hat nicht geklappt. Nutze „Drucken“ und wähle „Als PDF speichern“.');
  }catch(e){
    setMsg(e&&e.code==='declined'?'Abgebrochen.':(e&&e.message==='nolib'?'Der PDF-Baustein konnte nicht geladen werden. Bist du online?':'Speichern hat nicht geklappt.'));
  }
}

const cfg=k=>!(S.set&&S.set[k]===false);
let AC=null,curSeen=new Set(),tt=null;
function seenSet(){const set=new Set();S.trips.forEach(t=>{for(const k in t.counts){if(k[0]!=='#'&&t.counts[k])set.add(k.split('|')[0])}});return set}
function beep(isNew){
  if(!cfg('sound'))return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const now=AC.currentTime;
    const tone=(f0,f1,t0,dur,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(f0,now+t0);o.frequency.exponentialRampToValueAtTime(f1,now+t0+dur);g.gain.setValueAtTime(vol,now+t0);g.gain.exponentialRampToValueAtTime(0.0001,now+t0+dur);o.connect(g);g.connect(AC.destination);o.start(now+t0);o.stop(now+t0+dur+0.02)};
    if(isNew){tone(660,660,0,.12,.12);tone(990,990,.12,.2,.12)}else tone(1400,700,0,.06,.09);
  }catch(e){}
}

let cardBlob=null,cardName='';
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function ctxTally(x,px,py,n,maxX){
  x.strokeStyle='#F6C600';x.lineWidth=6;x.lineCap='round';const g=Math.floor(n/5),r=n%5;let cx=px;
  for(let i=0;i<g;i++){if(cx+62>maxX)return;for(let j=0;j<4;j++){x.beginPath();x.moveTo(cx+j*13,py-46);x.lineTo(cx+j*13,py);x.stroke()}x.beginPath();x.moveTo(cx-8,py-8);x.lineTo(cx+50,py-36);x.stroke();cx+=70}
  for(let j=0;j<r;j++){if(cx+j*13>maxX)return;x.beginPath();x.moveTo(cx+j*13,py-46);x.lineTo(cx+j*13,py);x.stroke()}
}
async function drawCard(t){
  try{await document.fonts.load('700 80px "Barlow Semi Condensed"')}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const FN='"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif';
  x.fillStyle='#0B4F9E';x.fillRect(0,0,W,H);
  x.strokeStyle='#fff';x.lineWidth=10;rrect(x,40,40,W-80,H-80,50);x.stroke();
  x.fillStyle='#fff';x.textBaseline='alphabetic';x.textAlign='left';
  x.font='700 66px '+FN;x.fillText('Car Counter',100,140);
  x.font='500 44px '+FN;
  const words=(t.dest||'Fahrt').split(' ');let lines=[],cur='';
  words.forEach(w=>{const test=cur?cur+' '+w:w;if(x.measureText(test).width>W-200&&cur){lines.push(cur);cur=w}else cur=test});lines.push(cur);
  lines=lines.slice(0,2);if(lines.length===2&&x.measureText(lines[1]).width>W-200)lines[1]=lines[1].slice(0,28)+'...';
  lines.forEach((l,i)=>x.fillText(l,100,205+i*52));
  x.font='500 38px '+FN;x.globalAlpha=.85;x.fillText(fmtDate(t.date),100,205+lines.length*52+6);x.globalAlpha=1;
  const tot=total(t);
  x.fillStyle='#F6C600';x.font='700 230px '+FN;x.fillText(String(tot),100,560);
  const nw=x.measureText(String(tot)).width;x.fillStyle='#fff';x.font='600 70px '+FN;x.fillText(tot===1?'Strich':'Striche',100+nw+24,560);
  x.fillRect(100,600,W-200,4);
  x.font='600 40px '+FN;x.fillText('Meistgesehen',100,665);
  const top=Object.entries(brandTotals(t)).sort((a,b)=>b[1]-a[1]).slice(0,5);
  top.forEach(([n,v],i)=>{const y=750+i*104;x.fillStyle='#fff';x.textAlign='left';x.font='700 54px '+FN;x.fillText(n.length>13?n.slice(0,12)+'.':n,100,y);
    x.textAlign='right';x.fillStyle='#F6C600';x.fillText(String(v),395,y);x.textAlign='left';ctxTally(x,430,y,v,W-100)});
  const seen=Object.keys(brandTotals(t)).length,all=allBrands().length;
  const st=statsFor([t]);const vw=st.tot?VWGROUP.reduce((a,b)=>a+(st.B[b]||0),0)/st.tot*100:0;
  x.fillStyle='#fff';x.textAlign='left';x.font='500 42px '+FN;x.fillText('Marken gesehen: '+seen+' von '+all,100,1225);
  x.fillText('VW-Konzern: '+nf(vw)+' % aller Striche',100,1282);
  return c;
}

function settingsHTML(){
  const row=(k,t,s)=>'<div class="set"><div><b>'+t+'</b><small>'+s+'</small></div><button class="sw'+(cfg(k)?' on':'')+'" role="switch" aria-checked="'+(cfg(k)?'true':'false')+'" aria-label="'+t+'" data-act="toggle" data-k="'+k+'"><i></i></button></div>';
  return'<h2>Einstellungen</h2>'+row('sound','Klick-Ton','Kurzer Ton bei jedem Strich')+row('vibe','Vibration','Funktioniert nur auf Android, nicht auf dem iPhone')+row('grey','Nie gesehene Marken ausgrauen','Marken, die du noch nie gezählt hast, erscheinen grau')+'<div class="btns"><button class="btn" data-act="vtest">Vibration testen</button></div><p class="muted" id="vmsg"></p><div class="btns"><button class="btn primary" data-act="closeSheet">Fertig</button></div>';
}

/* ---------- Vergleich ---------- */
const sortedTrips=()=>S.trips.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.t0||0)-(a.t0||0));
function resolveGroup(c){
  const st=sortedTrips(),cy=new Date().getFullYear();
  const yr=y=>st.filter(t=>t.date.slice(0,4)===String(y));
  if(c==='latest')return{l:'Neueste Fahrt',t:st.slice(0,1)};
  if(c==='prev')return{l:'Vorherige Fahrt',t:st.slice(1,2)};
  if(c==='all')return{l:'Alle Fahrten',t:st};
  if(c==='older')return{l:'Alle früheren Fahrten',t:st.slice(1)};
  if(c==='thisYear')return{l:'Dieses Jahr ('+cy+')',t:yr(cy)};
  if(c==='lastYear')return{l:'Letztes Jahr ('+(cy-1)+')',t:yr(cy-1)};
  if(c.startsWith('y:'))return{l:'Jahr '+c.slice(2),t:yr(c.slice(2))};
  if(c.startsWith('t:')){const t=st.find(x=>x.id===c.slice(2));return{l:t?'Fahrt '+fmtDate(t.date):'Fahrt',t:t?[t]:[]}}
  return{l:'?',t:[]};
}
function groupOptions(){
  const cy=new Date().getFullYear();
  const o=[['latest','Neueste Fahrt'],['prev','Vorherige Fahrt'],['all','Alle Fahrten (Gesamt)'],['older','Alle früheren Fahrten'],['thisYear','Dieses Jahr ('+cy+')'],['lastYear','Letztes Jahr ('+(cy-1)+')']];
  [...new Set(S.trips.map(t=>t.date.slice(0,4)))].sort().reverse().filter(y=>+y!==cy&&+y!==cy-1).forEach(y=>o.push(['y:'+y,'Jahr '+y]));
  sortedTrips().forEach(t=>o.push(['t:'+t.id,'Fahrt '+fmtDate(t.date)+' '+(t.dest||'').slice(0,26)]));
  return o;
}
function metrics(g){
  const st=statsFor(g.t),n=g.t.length,tot=st.tot;
  const or={};allBrands().forEach(([nm,,o])=>{if(st.B[nm])or[o]=(or[o]||0)+st.B[nm]});
  const vw=tot?VWGROUP.reduce((a,b)=>a+(st.B[b]||0),0)/tot*100:0;
  return{st,n,tot,avg:n?tot/n:0,seen:Object.keys(st.B).length,ph:st.perHour,vw,or,de:tot?(or.DE||0)/tot*100:0};
}
function cmpData(A,B){
  const a=metrics(A),b=metrics(B);
  const sh=(m,k)=>m.tot?(m.st.B[k]||0)/m.tot*100:0;
  const top=m=>Object.entries(m.st.B).sort((x,y)=>y[1]-x[1]).slice(0,8).map(e=>e[0]);
  const names=[...new Set(top(a).concat(top(b)))];
  const rows=names.map(k=>({k,a:sh(a,k),b:sh(b,k),ca:a.st.B[k]||0,cb:b.st.B[k]||0})).sort((x,y)=>Math.max(y.a,y.b)-Math.max(x.a,x.b));
  const all=[...new Set(Object.keys(a.st.B).concat(Object.keys(b.st.B)))].map(k=>({k,d:sh(a,k)-sh(b,k)}));
  const up=all.slice().sort((x,y)=>y.d-x.d)[0],down=all.slice().sort((x,y)=>x.d-y.d)[0];
  const orows=Object.keys(ORIGIN).map(o=>({k:ORIGIN[o],a:a.tot?(a.or[o]||0)/a.tot*100:0,b:b.tot?(b.or[o]||0)/b.tot*100:0})).filter(r=>r.a||r.b).sort((x,y)=>Math.max(y.a,y.b)-Math.max(x.a,x.b));
  const onlyA=Object.keys(a.st.B).filter(k=>!b.st.B[k]),onlyB=Object.keys(b.st.B).filter(k=>!a.st.B[k]);
  return{a,b,rows,orows,up,down,onlyA,onlyB};
}
const sgn=d=>(d>=0?'+':'−')+nf(Math.abs(d));
const grpLabel=g=>g.l+' ('+g.t.length+(g.t.length===1?' Fahrt':' Fahrten')+')';
function crowsHTML(rows,showCount){
  const mx=Math.max(...rows.map(r=>Math.max(r.a,r.b)),1);
  return'<div class="cmp">'+rows.map(r=>'<div class="crow"><div class="ctop"><span>'+esc(r.k)+'</span><span title="A minus B">'+sgn(r.a-r.b)+'</span></div>'
    +'<div class="cb"><span class="bar"><i class="a" style="width:'+Math.max(r.a?2:0,r.a/mx*100)+'%"></i></span><span class="pc">A: '+nf(r.a)+' %'+(showCount?' ('+r.ca+')':'')+'</span></div>'
    +'<div class="cb"><span class="bar"><i class="b" style="width:'+Math.max(r.b?2:0,r.b/mx*100)+'%"></i></span><span class="pc">B: '+nf(r.b)+' %'+(showCount?' ('+r.cb+')':'')+'</span></div></div>').join('')+'</div>';
}
function renderCompare(){
  const m=$('#main');
  const A=resolveGroup(ui.cmpA),B=resolveGroup(ui.cmpB),opts=groupOptions();
  const sel=(id,cur)=>'<select id="'+id+'">'+opts.map(([v,l])=>'<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  const pre=(a,b,l)=>'<button class="pill'+(ui.cmpA===a&&ui.cmpB===b?' on':'')+'" data-act="cmpPreset" data-a="'+a+'" data-b="'+b+'">'+l+'</button>';
  let h='<div class="pad"><h2>Vergleich</h2><div class="selrow"><div class="pills">'+pre('latest','prev','Neueste gegen vorherige')+pre('latest','older','Neueste gegen frühere')+pre('latest','all','Neueste gegen Gesamt')+pre('thisYear','lastYear','Jahr gegen Vorjahr')+'</div>'
   +'<label><span class="key a"></span>Gruppe A'+sel('cmpA',ui.cmpA)+'</label><label><span class="key b"></span>Gruppe B'+sel('cmpB',ui.cmpB)+'</label></div>';
  const empty=[];if(!A.t.length||!statsFor(A.t).tot)empty.push('A');if(!B.t.length||!statsFor(B.t).tot)empty.push('B');
  if(empty.length){
    h+='<p class="muted">In Gruppe '+empty.join(' und ')+' gibt es noch keine Striche. Wähle eine andere Gruppe oder zähle erst eine Fahrt.</p></div>';m.innerHTML=h;return;
  }
  const D=cmpData(A,B),a=D.a,b=D.b;
  h+='<div class="btns"><button class="btn primary" data-act="pdfCmp">Als PDF speichern</button><button class="btn" data-act="print">Drucken</button></div><p class="muted" id="pmsg"></p>';
  h+='<p><span class="key a"></span><b>A: '+esc(grpLabel(A))+'</b><br><span class="key b"></span><b>B: '+esc(grpLabel(B))+'</b></p>';
  const row=(l,x,y)=>'<tr><td>'+l+'</td><td class="n">'+x+'</td><td class="n">'+y+'</td></tr>';
  h+='<table class="ct"><tr><th></th><th>A</th><th>B</th></tr>'
    +row('Fahrten',a.n,b.n)+row('Striche gesamt',a.tot,b.tot)+row('Striche pro Fahrt (Ø)',nf(a.avg),nf(b.avg))+row('Marken gesehen',a.seen,b.seen)
    +((a.ph||b.ph)?row('Striche pro Stunde',a.ph?nf(a.ph):'–',b.ph?nf(b.ph):'–'):'')
    +row('VW-Konzern',nf(a.vw)+' %',nf(b.vw)+' %')+row('Deutsche Marken',nf(a.de)+' %',nf(b.de)+' %')+'</table>';
  h+='<h2>Marken im Vergleich</h2><p class="muted">Anteile in Prozent aller Striche, damit unterschiedlich lange Fahrten vergleichbar sind. Rechts oben steht A minus B in Prozentpunkten, in Klammern die echten Striche.</p>';
  if(D.up&&D.up.d>0)h+='<p>A hat mehr von <b>'+esc(D.up.k)+'</b> ('+sgn(D.up.d)+' Punkte).'+(D.down&&D.down.d<0?' A hat weniger von <b>'+esc(D.down.k)+'</b> ('+sgn(D.down.d)+' Punkte).':'')+'</p>';
  else if(D.down&&D.down.d<0)h+='<p>A hat weniger von <b>'+esc(D.down.k)+'</b> ('+sgn(D.down.d)+' Punkte).</p>';
  h+=crowsHTML(D.rows,true);
  h+='<h2>Herkunft</h2>'+crowsHTML(D.orows,false);
  h+='<details><summary>Nur in A gesehen ('+D.onlyA.length+')</summary><p>'+(D.onlyA.map(esc).join(', ')||'–')+'</p></details><details><summary>Nur in B gesehen ('+D.onlyB.length+')</summary><p>'+(D.onlyB.map(esc).join(', ')||'–')+'</p></details></div>';
  m.innerHTML=h;
}
async function pdfCompare(A,B){
  setMsg('PDF wird erstellt ...');
  try{
    const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('nolib');
    const D=cmpData(A,B),a=D.a,b=D.b;
    const doc=new J({unit:'mm',format:'a4'});const W=210,M=15;let y=0;
    doc.setFillColor(11,79,158);doc.rect(0,0,W,26,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Car Counter: Vergleich',M,12);
    doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Stand '+fmtDate(today()),M,20);doc.setTextColor(0);y=36;
    const need=h=>{if(y+h>284){doc.addPage();y=18}};
    const H=t=>{need(16);y+=4;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(11,79,158);doc.text(t,M,y);doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(10);y+=7};
    const P=t=>{doc.setFontSize(10);doc.splitTextToSize(t,W-2*M).forEach(l=>{need(5);doc.text(l,M,y);y+=5})};
    P('A: '+grpLabel(A));P('B: '+grpLabel(B));y+=2;
    doc.setFont('helvetica','bold');doc.text('A',120,y,{align:'right'});doc.text('B',160,y,{align:'right'});doc.setFont('helvetica','normal');y+=5;
    const kp=(l,x,z)=>{need(6);doc.text(l,M,y);doc.text(String(x),120,y,{align:'right'});doc.text(String(z),160,y,{align:'right'});y+=5.5};
    kp('Fahrten',a.n,b.n);kp('Striche gesamt',a.tot,b.tot);kp('Striche pro Fahrt (Durchschnitt)',nf(a.avg),nf(b.avg));kp('Marken gesehen',a.seen,b.seen);
    if(a.ph||b.ph)kp('Striche pro Stunde',a.ph?nf(a.ph):'-',b.ph?nf(b.ph):'-');
    kp('VW-Konzern',nf(a.vw)+' %',nf(b.vw)+' %');kp('Deutsche Marken',nf(a.de)+' %',nf(b.de)+' %');
    const tbl=rows=>{
      const mx=Math.max(...rows.map(r=>Math.max(r.a,r.b)),1);
      rows.forEach(r=>{need(11);doc.setTextColor(0);doc.setFontSize(10);doc.text(r.k,M,y);doc.text('A '+nf(r.a)+' %',120,y,{align:'right'});doc.text('B '+nf(r.b)+' %',160,y,{align:'right'});doc.text(sgn(r.a-r.b),195,y,{align:'right'});
        doc.setFillColor(29,47,166);doc.rect(M,y+1,Math.max(r.a?.6:0,r.a/mx*75),2,'F');doc.setFillColor(246,198,0);doc.rect(M,y+3.4,Math.max(r.b?.6:0,r.b/mx*75),2,'F');y+=9.5});
    };
    H('Marken im Vergleich');P('Anteile in Prozent aller Striche. Ganz rechts: A minus B in Prozentpunkten. Blau = A, Gelb = B.');tbl(D.rows);
    H('Herkunft');tbl(D.orows);
    H('Nur in A gesehen ('+D.onlyA.length+')');P(D.onlyA.join(', ')||'-');
    H('Nur in B gesehen ('+D.onlyB.length+')');P(D.onlyB.join(', ')||'-');
    const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text('Car Counter, Seite '+i+' von '+n,W/2,291,{align:'center'})}
    const blob=doc.output('blob');const r=await deliver(blob,'CarCounter_Vergleich_'+today()+'.pdf');setMsg(r==='ok'?'PDF gespeichert oder geteilt.':r==='abort'?'Abgebrochen.':'Speichern hat nicht geklappt. Nutze „Drucken“ und wähle „Als PDF speichern“.');
  }catch(e){setMsg(e&&e.code==='declined'?'Abgebrochen.':(e&&e.message==='nolib'?'Der PDF-Baustein konnte nicht geladen werden. Bist du online?':'Speichern hat nicht geklappt.'))}
}

/* ---------- Events ---------- */
let lpTimer=null,lpX=0,lpY=0;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(ui.lp){ui.lp=false;return}
  act(el.dataset.act,el.dataset,el);
});
document.addEventListener('pointerdown',e=>{
  ui.lp=false;clearTimeout(lpTimer);
  const tile=e.target.closest('.tile');if(!tile||e.target.closest('button'))return;
  lpX=e.clientX;lpY=e.clientY;
  lpTimer=setTimeout(()=>{ui.lp=true;const b=tile.dataset.brand;try{navigator.vibrate&&navigator.vibrate(70)}catch(_){}openSheet({kind:'brand',name:b})},550);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lpTimer)));
document.addEventListener('pointermove',e=>{if(lpTimer&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10))clearTimeout(lpTimer)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tile'))e.preventDefault()});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;updateList()}});
document.addEventListener('change',e=>{if(e.target.id==='scope'){ui.scope=e.target.value;renderStats()}else if(e.target.id==='cmpA'){ui.cmpA=e.target.value;renderCompare()}else if(e.target.id==='cmpB'){ui.cmpB=e.target.value;renderCompare()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    const t=e.target;
    if(t.classList&&t.classList.contains('tile')&&t.dataset.act==='inc'){e.preventDefault();inc(t.dataset.key)}
    else if(t.classList&&t.classList.contains('tr')){e.preventDefault();openSheet({kind:'trip',id:t.dataset.id})}
  }
  if(e.key==='Enter'){
    if(e.target.id==='note')act('addNote',{});
    else if(e.target.id==='cb')act('addCustom',{});
    else if(e.target.id==='ln0')act('addLaneNote',{lane:'Schiergar',inp:'ln0'});
    else if(e.target.id==='ln1')act('addLaneNote',{lane:'Parkplatz Exoten',inp:'ln1'});
    else if(e.target.id==='ln2')act('addLaneNote',{lane:ui.sub==='mit'?'Mitspur':'Gegenspur',inp:'ln2'});
    else if(e.target.id==='dest')act('startTrip',{});
  }
  if(e.key==='Escape'&&ui.sheet)closeSheet();
});
render();
</script>
<script>(function(){var s=document.getElementById('splash');if(!s)return;var l=document.querySelector('link[rel="icon"]');var im=s.querySelector('img');if(l&&l.href){im.src=l.href}else{im.style.display='none'}
function hide(){s.classList.add('hide');setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},600)}
s.addEventListener('click',hide);setTimeout(hide,1700);})();</script>
